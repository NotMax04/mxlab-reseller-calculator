<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<title>Aggiornamento MXLAB</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#090b10;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.card{width:min(520px,100%);background:#121722;border:1px solid #293244;border-radius:22px;padding:28px;box-shadow:0 20px 70px #0008}.logo{font-size:13px;letter-spacing:.18em;color:#91a4c5;font-weight:800}h1{font-size:28px;margin:10px 0 12px}p{color:#bdc7d8;line-height:1.5;margin:0 0 18px}.status{padding:14px 16px;border-radius:14px;background:#0d1119;color:#dce5f5}.ok{color:#8fe3b5}.error{color:#ffaaa3}button{width:100%;margin-top:16px;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:750;background:#f5f7fa;color:#111827;display:none}
</style>
</head>
<body><main class="card"><div class="logo">MXLAB</div><h1>Aggiornamento sicuro</h1><p>Vengono eliminate soltanto le vecchie cache del sito. Articoli, impostazioni e fotografie non vengono cancellati.</p><div class="status" id="status">Rimozione della cache 3.5.3…</div><button id="retry">Riprova</button></main>
<script>
const status=document.getElementById('status'),retry=document.getElementById('retry');
async function recover(){
  retry.style.display='none';status.className='status';status.textContent='Rimozione della cache 3.5.3…';
  try{
    if('serviceWorker' in navigator){
      const registrations=await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(registration=>registration.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(key=>key.startsWith('mxlab-hub-')).map(key=>caches.delete(key)));
    }
    status.className='status ok';status.textContent='Cache rimossa. Apertura della versione 3.5.6…';
    const target=new URL('./index.html',location.href);
    target.searchParams.set('build','356');
    target.searchParams.set('t',Date.now().toString());
    setTimeout(()=>location.replace(target.href),500);
  }catch(error){
    console.error(error);status.className='status error';status.textContent='Aggiornamento non completato. Premi Riprova.';retry.style.display='block';
  }
}
retry.addEventListener('click',recover);recover();
</script></body></html>
